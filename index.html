<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="A simple hello page.">
<meta name="theme-color" content="#0f172a">
<title>Hello page</title>
<!-- Relative, not root-absolute: the site is served from /test-project/ on
     project Pages, so "/favicon.ico" would resolve to the user-site root. -->
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  html, body {
    height: 100%;
    margin: 0;
    background: #0f172a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  body {
    height: auto;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 1.5rem;
  }
  h1 {
    margin: 0 0 1rem;
    color: #f8fafc;
    font-size: clamp(2rem, 8vw, 3rem);
    font-weight: 600;
  }
  p {
    color: #94a3b8;
    margin: 0.25rem 0;
    line-height: 1.5;
  }
</style>
</head>
<body>
<h1>Hello World 🌍</h1>
<p>A test page.</p>
<p>Thanks for stopping by!</p>
<p>Hope you have a lovely day!</p>
</body>
</html>
